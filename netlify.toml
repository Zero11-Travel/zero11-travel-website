# Netlify configuration for Zero11 Travel & Tours
#
# SSR build (`nuxt build`, not `nuxt generate`) — the contact form depends on
# server/api/contact.post.ts, which needs a server runtime. Nitro's Netlify
# preset deploys the server bundle as a Netlify Function.
#
# Security/cache headers live in public/_headers (static files) and
# nitro.routeRules in nuxt.config.ts (server-rendered pages), shared with the
# Cloudflare deployment — so they are not duplicated here.
# See DEPLOYMENT.md.

[build]
  command = "pnpm install --no-frozen-lockfile && pnpm build:netlify"
  # Nitro's `netlify` preset publishes static assets to `dist/` and the SSR
  # server to `.netlify/functions-internal/server/` (Netlify auto-detects the
  # function). NOT `.output/public` — that is only written by the `static`/
  # `generate` presets, so pointing here would fail the deploy ("directory does
  # not exist") on a clean build.
  publish = "dist"

[build.environment]
  # Node 22, not 20: the build pulls in postcss-merge-longhand (via Nuxt's CSS
  # minifier), which calls Set.prototype.difference() — a method that only
  # exists in Node 22+. On Node 20 the build dies with
  # "TypeError: trustedFunctions.difference is not a function".
  NODE_VERSION = "22"
  PNPM_VERSION = "10"
